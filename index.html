<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영수증 팩트폭행러 - 소비 코치</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 500px; width: 100%; margin-bottom: 20px; text-align: center; box-sizing: border-box; }
        h1 { font-size: 24px; color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; }

        #uploadArea { transition: all 0.5s ease; }
        .upload-label { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px dashed #3498db; border-radius: 15px; padding: 40px; cursor: pointer; transition: background 0.3s; }
        .upload-label:hover { background: #ecf0f1; }
        .upload-icon { font-size: 48px; color: #3498db; margin-bottom: 10px; }
        .upload-text { color: #3498db; font-weight: bold; }
        input[type="file"] { display: none; }

        #previewContainer { margin-top: 20px; display: none; }
        #previewImage { max-width: 100%; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { border: none; padding: 15px 30px; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s, transform 0.1s; width: 100%; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-reset { background: #95a5a6; color: #fff; display: none; }
        .btn-reset:hover { background: #7f8c8d; }

        #loadingArea { display: none; text-align: center; margin: 30px 0; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #resultArea { display: none; text-align: left; }
        .result-card { background: #fff; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-bottom: 20px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .stamp { font-size: 28px; font-weight: bold; padding: 5px 15px; border-radius: 10px; transform: rotate(-5deg); border: 3px solid; }
        .stamp.합격 { color: #2ecc71; border-color: #2ecc71; }
        .stamp.주의 { color: #f1c40f; border-color: #f1c40f; }
        .stamp.과소비 { color: #e74c3c; border-color: #e74c3c; }
        .stamp.알뜰 { color: #3498db; border-color: #3498db; }
        .merchant { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .amount { font-size: 24px; font-weight: bold; color: #e67e22; margin-top: 5px; }
        .badge { background: #34495e; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .headline { font-style: italic; color: #7f8c8d; margin: 15px 0; font-size: 16px; line-height: 1.5; }
        .points { margin-top: 15px; }
        .points p { margin: 5px 0; font-size: 14px; line-height: 1.4; }
        .points strong { color: #2c3e50; }

        .stats-card { background: #2c3e50; color: #fff; border-radius: 15px; padding: 25px; text-align: left; margin-top: 10px; }
        .stats-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #4a6077; padding-bottom: 10px; }
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .stats-total { font-size: 20px; font-weight: bold; margin-top: 15px; color: #f1c40f; line-height: 1.4; }
        .category-bar-container { height: 6px; background: #4a6077; border-radius: 3px; margin-top: 5px; overflow: hidden; display: flex; }
        .category-bar { height: 100%; }
        .cat-식비 { background: #e67e22; }
        .cat-배달 { background: #3498db; }
        .cat-카페\/간식 { background: #9b59b6; }
        .cat-교통 { background: #1abc9c; }
        .cat-쇼핑\/생활 { background: #34495e; }
        .cat-기타 { background: #7f8c8d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI 영수증 팩트폭행러</h1>
        <p class="subtitle">당신의 지갑 사정을 냉정하게 코치해드립니다.</p>

        <div id="uploadArea">
            <label for="fileInput" class="upload-label">
                <span class="upload-icon">📷</span>
                <span class="upload-text">영수증 또는 배달앱 캡처 올리기</span>
            </label>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <div id="previewContainer">
            <img id="previewImage" src="#" alt="영수증 미리보기">
            <div style="display: flex; gap: 10px;">
                <button id="analyzeBtn" class="btn btn-primary" onclick="analyzeReceipt()">내 소비 피드백 받기 ✨</button>
                <button id="newAnalyzeBtn" class="btn btn-reset" onclick="resetApp()" style="display: block;">새 영수증 분석하기</button>
            </div>
        </div>

        <div id="loadingArea">
            <div class="spinner"></div>
            <p id="loadingText">AI 코치가 영수증을 분석 중입니다...<br>잠시만 기다려주세요.</p>
        </div>

        <div id="resultArea"></div>
    </div>

    <div class="container stats-card">
        <div class="stats-title">📊 나의 소비 통계 (누적)</div>
        <div class="stats-row"><span>총 분석 건수</span> <strong id="statsCount">0건</strong></div>
        <div class="stats-row"><span>총 지출 합계</span> <strong id="statsTotalAmount">0원</strong></div>
        <div class="stats-row"><span>평균 합리성 점수</span> <strong id="statsAvgScore">0점</strong></div>
        <div id="categoryBreakdown" class="points"></div>
        <div class="stats-total" id="statsComment"></div>
    </div>

    <script>
        let currentFile = null;
        const CATEGORIES = ["식비", "배달", "카페/간식", "교통", "쇼핑/생활", "기타"];
        const CAT_COLORS = ["cat-식비", "cat-배달", "cat-카페/간식", "cat-교통", "cat-쇼핑/생활", "cat-기타"];
        const STORAGE_KEY = 'receipt_check_history';

        window.onload = function() {
            updateStatsUI();
        };

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('uploadArea').style.display = 'none';
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('resultArea').style.display = 'none';
                    document.getElementById('analyzeBtn').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function resetApp() {
            currentFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewImage').src = '#';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('analyzeBtn').style.display = 'block';
        }

        async function analyzeReceipt() {
            if (!currentFile) return;

            document.getElementById('analyzeBtn').style.display = 'none';
            document.getElementById('newAnalyzeBtn').style.display = 'none';
            document.getElementById('loadingArea').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';

            const formData = new FormData();
            formData.append("file", currentFile);

            try {
                const response = await fetch("/analyze", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "서버 분석 실패");
                }

                const data = await response.json();
                displayResult(data);
                saveDataToLocalStorage(data);
                updateStatsUI();

                // 분석 완료 시 미리보기 이미지와 파일 입력 상태 정리
                currentFile = null;
                document.getElementById('fileInput').value = '';
                document.getElementById('previewImage').src = '#';
                document.getElementById('previewContainer').style.display = 'none';
            } catch (error) {
                console.error("Error:", error);
                alert("분석 중 오류가 발생했습니다: " + error.message);
                resetApp();
            } finally {
                document.getElementById('loadingArea').style.display = 'none';
                document.getElementById('newAnalyzeBtn').style.display = 'block';
            }
        }

        function displayResult(data) {
            const resultArea = document.getElementById('resultArea');
            const amount = Number(data.amount || 0).toLocaleString('ko-KR');
            const stampClass = String(data.stamp || '').replace(/\s/g, '');

            resultArea.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="stamp ${stampClass}">${data.stamp}</span>
                        <div style="text-align:right;">
                            <div class="merchant">${data.merchant}</div>
                            <div class="amount">${amount} 원</div>
                        </div>
                    </div>
                    <div>
                        <span class="badge">${data.badge}</span>
                        <p class="headline">${data.headline}</p>
                        <div class="points">
                            <p><strong>👍 잘한 점:</strong> ${data.good_point}</p>
                            <p><strong>🤔 아쉬운 점:</strong> ${data.bad_point}</p>
                            <p><strong>🎯 다음 미션:</strong> ${data.next_mission}</p>
                        </div>
                    </div>
                </div>
            `;
            resultArea.style.display = 'block';
        }

        function getHistory() {
            const history = localStorage.getItem(STORAGE_KEY);
            return history ? JSON.parse(history) : [];
        }

        function saveDataToLocalStorage(newData) {
            const history = getHistory();
            newData.id = Date.now();
            history.push(newData);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        function updateStatsUI() {
            const history = getHistory();
            const count = history.length;
            document.getElementById('statsCount').textContent = `${count}건`;

            if (count === 0) {
                document.getElementById('statsTotalAmount').textContent = '0원';
                document.getElementById('statsAvgScore').textContent = '0점';
                document.getElementById('statsComment').textContent = '아직 분석한 내역이 없네요. 첫 영수증을 올려보세요!';
                document.getElementById('categoryBreakdown').innerHTML = '';
                return;
            }

            let totalAmount = 0;
            let totalScore = 0;
            const categoryTotals = {};
            CATEGORIES.forEach(cat => categoryTotals[cat] = 0);

            history.forEach(item => {
                totalAmount += Number(item.amount || 0);
                totalScore += Number(item.score || 0);
                if (Object.prototype.hasOwnProperty.call(categoryTotals, item.category)) {
                    categoryTotals[item.category] += Number(item.amount || 0);
                } else {
                    categoryTotals['기타'] += Number(item.amount || 0);
                }
            });

            const avgScore = (totalScore / count).toFixed(0);
            document.getElementById('statsTotalAmount').textContent = totalAmount.toLocaleString('ko-KR') + '원';
            document.getElementById('statsAvgScore').textContent = `${avgScore}점`;

            let barHTML = '<div class="category-bar-container">';
            let breakdownHTML = '';

            CATEGORIES.forEach((cat, index) => {
                const amount = categoryTotals[cat];
                if (amount > 0) {
                    const percentage = totalAmount > 0 ? (amount / totalAmount * 100).toFixed(1) : 0;
                    const barColor = CAT_COLORS[index % CAT_COLORS.length];
                    barHTML += `<div class="category-bar ${barColor}" style="width: ${percentage}%" title="${cat}: ${percentage}%"></div>`;
                    breakdownHTML += `<p><strong>${cat}:</strong> ${amount.toLocaleString('ko-KR')}원 (${percentage}%)</p>`;
                }
            });
            barHTML += '</div>';

            document.getElementById('categoryBreakdown').innerHTML = barHTML + breakdownHTML;

            let comment = "";
            const lastScore = history[count - 1]?.score;

            if (count > 1) {
                if (avgScore >= 80) comment = "💎 이 구역의 알뜰왕! 지금처럼만 유지하세요.";
                else if (avgScore >= 60) comment = "👍 전반적으로 무난한 소비 생활 중입니다.";
                else comment = "💸 지갑에 구멍이 났어요! 긴급 처방이 필요합니다.";

                if (lastScore && lastScore > Number(avgScore) + 5) {
                    comment += "<br>🎉 이번 소비는 평소보다 훨씬 합리적이었습니다!";
                } else if (lastScore && lastScore < Number(avgScore) - 5) {
                    comment += "<br>🚨 이번 소비는 평소보다 과소비 경향이 있네요.";
                }
            } else {
                comment = "첫걸음이 중요합니다. 계속 기록해 볼까요?";
            }

            document.getElementById('statsComment').innerHTML = comment;
        }
    </script>
</body>
</html>
